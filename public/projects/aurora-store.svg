<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#0D121A"/>
  <defs>
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121923"/>
      <stop offset="0.5" stop-color="#070A0F"/>
      <stop offset="1" stop-color="#182231"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#121923" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#auroraGrad)"/>

  <!-- Browser Frame -->
  <g transform="translate(80, 60)">
    <rect width="1040" height="630" rx="12" fill="#121923" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="1040" height="48" rx="12" fill="#070A0F"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>
    <!-- Store Header -->
    <rect x="200" y="12" width="640" height="24" rx="4" fill="#0D121A" stroke="#1E293B"/>
    <text x="520" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">auroralifestyle.com.au/collection/autumn-curated</text>

    <!-- Navigation inside store -->
    <text x="50" y="88" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1">AURORA</text>
    <text x="180" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">New Arrivals</text>
    <text x="280" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Apparel</text>
    <text x="360" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Accessories</text>

    <rect x="880" y="70" width="110" height="30" rx="15" fill="#1E293B"/>
    <text x="935" y="90" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cart (2) • AUD</text>

    <!-- Product Grid -->
    <!-- Card 1 -->
    <rect x="50" y="130" width="290" height="440" rx="8" fill="#0D121A" stroke="#1E293B"/>
    <rect x="50" y="130" width="290" height="280" rx="8" fill="#182231"/>
    <circle cx="195" cy="270" r="60" fill="#3B82F6" fill-opacity="0.1"/>
    <path d="M165 250 L225 250 L210 300 L180 300 Z" fill="#60A5FA" opacity="0.4"/>
    <text x="70" y="440" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Minimalist Travel Weekender</text>
    <text x="70" y="465" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Weather-resistant canvas</text>
    <text x="70" y="500" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="16" font-weight="700">$245 AUD</text>
    <rect x="230" y="480" width="90" height="32" rx="6" fill="#3B82F6"/>
    <text x="275" y="501" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Add to Bag</text>

    <!-- Card 2 -->
    <rect x="375" y="130" width="290" height="440" rx="8" fill="#0D121A" stroke="#1E293B"/>
    <rect x="375" y="130" width="290" height="280" rx="8" fill="#182231"/>
    <circle cx="520" cy="270" r="50" fill="#3B82F6" fill-opacity="0.1"/>
    <text x="395" y="440" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Merino Wool Overshirt</text>
    <text x="395" y="465" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Sustainable organic blend</text>
    <text x="395" y="500" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="16" font-weight="700">$190 AUD</text>
    <rect x="555" y="480" width="90" height="32" rx="6" fill="#182231" stroke="#1E293B"/>
    <text x="600" y="501" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Select Size</text>

    <!-- Card 3 -->
    <rect x="700" y="130" width="290" height="440" rx="8" fill="#0D121A" stroke="#1E293B"/>
    <rect x="700" y="130" width="290" height="280" rx="8" fill="#182231"/>
    <circle cx="845" cy="270" r="45" fill="#3B82F6" fill-opacity="0.1"/>
    <text x="720" y="440" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Titanium Daily Wristwatch</text>
    <text x="720" y="465" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Precision sapphire crystal</text>
    <text x="720" y="500" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="16" font-weight="700">$380 AUD</text>
    <rect x="880" y="480" width="90" height="32" rx="6" fill="#182231" stroke="#1E293B"/>
    <text x="925" y="501" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Select Size</text>
