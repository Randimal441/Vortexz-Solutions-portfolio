<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#070A0F"/>
  <defs>
    <radialGradient id="ogGlow" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Orbital visual rings in background -->
  <circle cx="850" cy="315" r="220" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="850" cy="315" r="150" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1.5"/>
  <ellipse cx="850" cy="315" rx="280" ry="110" stroke="#60A5FA" stroke-opacity="0.25" stroke-width="2" transform="rotate(-30 850 315)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 120)">
    <rect width="64" height="64" rx="14" fill="#0D121A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="4" fill="#3B82F6"/>
    <ellipse cx="32" cy="32" rx="12" ry="7" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3 2" transform="rotate(-25 32 32)"/>
    <path d="M 18 36 C 18 24, 46 20, 46 32 C 46 44, 22 46, 22 34" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title & copy -->
  <text x="100" y="240" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3">VORTEXZ SOLUTIONS</text>
  <text x="100" y="320" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="52" font-weight="800">Digital Solutions Built for</text>
  <text x="100" y="380" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="52" font-weight="800">Growing Businesses.</text>
  
  <text x="100" y="440" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="20">Web Development • Custom Web Systems • Mobile Apps • UI/UX Design</text>
  <text x="100" y="520" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Serving Businesses across Sri Lanka and Australia</text>
</svg>
